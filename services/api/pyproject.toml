[project]
name = "aakar-api"
version = "0.1.0"
description = "Aakar API — ingest, retrieve, generate, critic, cache"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.12",
    # Ingest boundary only: page count, encryption detection and page LABELS (2A.3/4/6).
    # Deliberately NOT the parser — LightningParse owns chunking and page-numbered text.
    "pypdf>=5.1",
    # Spec S3s pinned parser. Pinned exactly: 3.1.0 also exists on PyPI but is out of
    # sequence with the 0.x line, so an unpinned range could resolve to it silently.
    "lightningparse==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "datamodel-code-generator>=0.26",
    # D-009: the generation pipeline drives Playwright from here against the web app.
    # The Phase 1 screenshot harness is a thin CLI over the same code path the Phase 3
    # critic uses, so gate captures and critic captures cannot drift apart.
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aakar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["aakar", "tests"]

[[tool.mypy.overrides]]
# lightningparse ships a Rust extension with no py.typed marker; parser.py wraps it and
# is itself fully typed, so the untyped boundary stops at that one module.
module = ["passlib.*", "lightningparse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Generated from the JSON Schema by `make codegen`; formatting is the generator's call.
"aakar/scenespec/generated.py" = ["ALL"]
