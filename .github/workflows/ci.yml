name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Rule 7 / D8: CI never makes a live model call and never needs a key.
  AAKAR_PROVIDER_MODE: replay
  AAKAR_AUTH_SECRET: ci-only-secret-at-least-32-bytes-long

jobs:
  api:
    name: api (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Named separately from the full suite so a corpus failure is legible in the job
      # list. codegen-check compares generated bytes; this is what proves the generated
      # validator actually validates (D-015).
      # D-045: a pin to a retired model must fail at boot, not on first real call. Runs
      # with no key, which is the only reason it can run here at all.
      - name: model pins are live
        run: uv run pytest tests/test_model_pins.py -q
      - name: conformance corpus (pydantic)
        run: uv run pytest tests/test_conformance.py -q
      # Verdict agreement is not behavioural agreement: both validators can accept the
      # same document and return different values. This is the axis that catches D-018.
      - name: behavioural conformance (pydantic)
        run: uv run pytest tests/test_behavioural_conformance.py -q
      - name: referential constraints (pydantic)
        run: uv run pytest tests/test_referential.py -q
      # 2A: the ingest boundary is a denial-of-service surface, not a cost surface, so no
      # budget guard covers it. Named separately for the same reason as the corpus tests.
      - name: ingest limits and dedupe
        run: uv run pytest tests/test_ingest.py tests/test_migration.py tests/test_async_ingest.py -q
      # 2B: tiering, the semantic cache, quotas, degraded mode and the account ceiling.
      - name: rag spend controls
        run: uv run pytest tests/test_rag_controls.py -q
      # 2C. The Qdrant-backed tests skip when no index is reachable rather than failing,
      # so CI stays green without a service container while still running locally against
      # a real one. A fake index would prove the harness works, not the collection shape.
      - name: retrieval and /ask
        run: uv run pytest tests/test_retrieval.py -q
      # A committed credential is not caught by any other check here: it is valid code,
      # valid JSON and a passing test. The shape scan runs with no key of its own, which is
      # the only reason it can run in CI at all — and it is tested against a PLANTED key, so
      # a green result means something (R2).
      - name: no API key committed
        run: uv run python -m aakar.evals.keyscan
      - run: uv run pytest -q

  web:
    name: web (eslint + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # D-009: the Phase 3 critic drives Playwright from services/api against this app.
      # The browser dependency lands in Phase 0 so it cannot surprise us in Phase 3.
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      # The zod half of the same corpus. Both stacks must agree on every fixture.
      - name: conformance corpus (zod)
        run: npx vitest run src/scenespec/conformance.test.ts
      - name: behavioural conformance (zod)
        run: npx vitest run src/scenespec/behaviour.test.ts
      - name: referential constraints (zod)
        run: npx vitest run src/scenespec/referential.test.ts
      - run: npm run test

  drift:
    name: codegen drift (D7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: cd apps/web && npm ci
      - run: cd services/api && uv sync --extra dev
      # Regenerates both type files and fails if the working tree changed — editing the
      # schema without running `make codegen` must not reach main.
      - run: make codegen-check
