# Qdrant only. Keep infra light (spec §3).
services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: aakar-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is always present.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
